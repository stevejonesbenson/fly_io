name: 🍡 Push
run-name: 🍡 Push on ${{ github.ref_name }} by @${{ github.actor }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish_to_hex:
    name: 📦 Publish [Hex]
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
    - name: 💧 Elixir
      uses: aumegroup/setup-elixir@master
      
      with:
        hex-ci-auth-key: ${{ secrets.HEX_APM_KEY }}
    - name: 🔧 Compile
      uses: aumegroup/compile-elixir-project@master

    - name: 📦 Publish [Hex]
      shell: sh
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        mix apm.toggle
        mix hex.publish --yes
